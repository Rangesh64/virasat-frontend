<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virasat Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        heritage: '#D97757'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-darkbg text-white h-screen flex flex-col font-sans">
    
    <header class="flex justify-between items-center p-6">
        <div class="text-2xl font-bold text-heritage">Virasat Guide</div>
        <div>
            <a href="#" class="mr-6 hover:text-heritage">Login</a>
            <a href="#" class="bg-heritage px-5 py-2 rounded-md font-semibold text-white">Sign Up</a>
        </div>
    </header>

    <main class="flex-grow flex flex-col justify-center items-center text-center px-6">
        <h1 class="text-5xl font-extrabold mb-4">Discover History. Hands-Free.</h1>
        <p class="text-gray-400 text-lg max-w-lg mb-8">
            Walk around monuments while your personal AI audio guide tells you the real stories of the past.
        </p>
        <button class="bg-heritage px-8 py-3 rounded-full text-xl font-bold hover:opacity-90">
            Start Tour
        </button>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
